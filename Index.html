<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawson Williams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #fafaf7;
            --bg-soft: #f4f1ec;
            --fg: #1a1a1a;
            --muted: #6b6b6b;
            --accent: #2a3d2f;
            --border: rgba(0, 0, 0, 0.06);
            --card: #ffffff;
        }

        html, body {
            min-height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at top left, rgba(180, 200, 175, 0.18), transparent 55%),
                radial-gradient(ellipse at bottom right, rgba(230, 210, 190, 0.22), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 720px;
            margin: 0 auto;
            padding: 5rem 1.5rem 4rem;
            animation: fadeIn 0.9s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }

        header {
            text-align: center;
            margin-bottom: 3.5rem;
        }

        .name {
            font-family: 'Fraunces', Georgia, serif;
            font-size: clamp(2.5rem, 6vw, 3.5rem);
            font-weight: 500;
            letter-spacing: -0.02em;
            line-height: 1.1;
            margin-bottom: 1rem;
        }

        .tagline {
            color: var(--muted);
            font-size: 1.05rem;
            font-weight: 300;
            max-width: 420px;
            margin: 0 auto;
            letter-spacing: -0.005em;
        }

        .badge-section {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 2rem 1.5rem;
            box-shadow:
                0 1px 2px rgba(0, 0, 0, 0.02),
                0 8px 24px rgba(0, 0, 0, 0.04);
            display: flex;
            justify-content: center;
            margin-bottom: 2.5rem;
        }

        .actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 3rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            padding: 0.85rem 1.6rem;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.005em;
            text-decoration: none;
            transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
        }

        .btn-primary {
            background: var(--accent);
            color: #fafaf7;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(42, 61, 47, 0.18);
        }

        .btn-secondary {
            background: transparent;
            color: var(--fg);
            border: 1px solid rgba(0, 0, 0, 0.12);
        }

        .btn-secondary:hover {
            background: var(--bg-soft);
            transform: translateY(-1px);
        }

        .icon {
            width: 16px;
            height: 16px;
        }

        footer {
            text-align: center;
            font-size: 0.825rem;
            color: var(--muted);
            font-weight: 300;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
        }

        footer a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        footer a:hover {
            color: var(--fg);
            border-bottom-color: var(--fg);
        }

        @media (max-width: 480px) {
            main { padding: 3rem 1.25rem; }
            .badge-section { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1 class="name">Dawson Williams</h1>
            <p class="tagline">Profile and updates synced live from LinkedIn.</p>
        </header>

        <section class="badge-section" aria-label="LinkedIn profile">
            <div class="badge-base LI-profile-badge"
                 data-locale="en_US"
                 data-size="large"
                 data-theme="light"
                 data-type="VERTICAL"
                 data-vanity="dawsonwilliams"
                 data-version="v1">
                <a class="badge-base__link LI-simple-link"
                   href="https://www.linkedin.com/in/dawsonwilliams?trk=profile-badge">
                    Dawson Williams
                </a>
            </div>
        </section>

        <div class="actions">
            <a class="btn btn-primary" href="https://www.linkedin.com/in/dawsonwilliams" target="_blank" rel="noopener">
                <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.72V1.72C24 .77 23.2 0 22.22 0z"/>
                </svg>
                View LinkedIn
            </a>
            <a class="btn btn-secondary" href="mailto:contact@dawsonwilliams.org">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                Email me
            </a>
        </div>

        <footer>
            <a href="mailto:contact@dawsonwilliams.org">contact@dawsonwilliams.org</a>
        </footer>
    </main>

    <script src="https://platform.linkedin.com/badges/js/profile.js" async defer type="text/javascript"></script>
</body>
</html>
