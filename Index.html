<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawson Williams</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a0a;
            --fg: #fafafa;
            --muted: #a1a1aa;
            --accent: #fafafa;
            --card: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.08);
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--fg);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.12), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.08), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        main {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 480px;
            width: 100%;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .name {
            font-size: clamp(2rem, 5vw, 2.75rem);
            font-weight: 600;
            letter-spacing: -0.03em;
            margin-bottom: 0.75rem;
        }

        .tagline {
            color: var(--muted);
            font-size: 1rem;
            font-weight: 400;
            margin-bottom: 2.5rem;
            letter-spacing: -0.01em;
        }

        .contact-button {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.9rem 1.75rem;
            background: var(--fg);
            color: var(--bg);
            text-decoration: none;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .contact-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(255, 255, 255, 0.1);
        }

        .contact-button:active {
            transform: translateY(0);
        }

        .icon {
            width: 16px;
            height: 16px;
        }

        .email {
            margin-top: 1.5rem;
            font-size: 0.875rem;
            color: var(--muted);
            font-variant-numeric: tabular-nums;
        }

        .email a {
            color: var(--muted);
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        .email a:hover {
            color: var(--fg);
            border-bottom-color: var(--fg);
        }
    </style>
</head>
<body>
    <main>
        <h1 class="name">Dawson Williams</h1>
        <p class="tagline">Get in touch.</p>
        <a class="contact-button" href="mailto:contact@dawsonwilliams.org">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            Email me
        </a>
        <p class="email"><a href="mailto:contact@dawsonwilliams.org">contact@dawsonwilliams.org</a></p>
    </main>
</body>
</html>
